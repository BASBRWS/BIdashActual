<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Stroomschema in zes stappen: van 90 signaalgevers met hun levensduur, via de uitvalsprognose en de beschikbaarheid van het wegdeel, naar de vier dienstverleningen, de benodigde WIS-inzet en de kosten per jaar en cumulatief."><rect x="0" y="0" width="1000" height="470" fill="#ffffff"/><text x="24" y="30" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1a2332" text-anchor="start">Van signaalgever tot euro: de keten in zes stappen</text><text x="24" y="50" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#68778c" text-anchor="start">momentopname 2032, met het eindbeeld 2036 ernaast</text><defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b7c2d2"/></marker></defs><rect x="40" y="76" width="280" height="152" rx="4" fill="#ffffff" stroke="#b7c2d2" stroke-width="1.2"/><text x="54" y="100" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1a2332" text-anchor="start">1 · Areaal en levensduur</text><text x="54" y="122" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">90 signaalgevers · 17,4 km</text><text x="54" y="139" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">A12 RE, hm 60,0–78,0</text><text x="54" y="156" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">bouwjaren 2012 / 2016 / 2020</text><text x="54" y="173" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">levensduur 20 jaar</text><text x="54" y="190" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">EoL 2032 / 2036 / 2040</text><rect x="360" y="76" width="280" height="152" rx="4" fill="#ffffff" stroke="#b7c2d2" stroke-width="1.2"/><text x="374" y="100" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1a2332" text-anchor="start">2 · Uitvalsprognose</text><text x="374" y="122" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">1.000 Monte Carlo-runs</text><text x="374" y="139" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">degradatie vanaf 20% voor EoL</text><text x="374" y="156" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">kans permanent na EoL 75%</text><text x="374" y="173" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">2032: 31,2% uit</text><text x="374" y="190" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">2036: 64,4% uit</text><rect x="680" y="76" width="280" height="152" rx="4" fill="#ffffff" stroke="#b7c2d2" stroke-width="1.2"/><text x="694" y="100" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1a2332" text-anchor="start">3 · Beschikbaarheid wegdeel</text><text x="694" y="122" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">100% − 31,2% = 68,8%</text><text x="694" y="139" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">in 2036: 35,6%</text><text x="694" y="156" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">permanent uit 2036: 33,2%</text><text x="694" y="173" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start"></text><text x="694" y="190" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">aandeel dat nog functioneert</text><rect x="40" y="286" width="280" height="152" rx="4" fill="#ffffff" stroke="#b7c2d2" stroke-width="1.2"/><text x="54" y="310" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1a2332" text-anchor="start">4 · Dienstverlening</text><text x="54" y="332" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">dienst = 100 − gewicht × uitval</text><text x="54" y="349" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">Verkeersmanagement 55% → 82,8%</text><text x="54" y="366" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">Werk in Uitvoering 35% → 89,1%</text><text x="54" y="383" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">Incidentmanagement 24% → 92,5%</text><text x="54" y="400" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">Reis- &amp; route-info 17% → 94,8%</text><rect x="360" y="286" width="280" height="152" rx="4" fill="#ffffff" stroke="#b7c2d2" stroke-width="1.2"/><text x="374" y="310" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1a2332" text-anchor="start">5 · WIS-compensatie</text><text x="374" y="332" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">17,4 km × 31,2% = 5,44 km</text><text x="374" y="349" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">norm 12 FTE per 95 km</text><text x="374" y="366" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">5,44 × 12 ÷ 95 = 0,69 FTE</text><text x="374" y="383" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">in 2036: 1,42 FTE</text><text x="374" y="400" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">bovenop de basis van 300 FTE</text><rect x="680" y="286" width="280" height="152" rx="4" fill="#f6f8fc" stroke="#3a72cc" stroke-width="1.6"/><text x="694" y="310" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#3a72cc" text-anchor="start">6 · Kosten</text><text x="694" y="332" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">0,69 FTE × € 95.000</text><text x="694" y="349" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">= € 65.238 in 2032</text><text x="694" y="366" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">cumulatief t/m 2032: € 195.759</text><text x="694" y="383" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">cumulatief t/m 2036: € 650.732</text><text x="694" y="400" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10.5" font-weight="400" fill="#68778c" text-anchor="start">6,85 FTE-jaren totaal</text><line x1="320" y1="152" x2="356" y2="152" stroke="#b7c2d2" stroke-width="1.5" marker-end="url(#pijl)"/><line x1="640" y1="152" x2="676" y2="152" stroke="#b7c2d2" stroke-width="1.5" marker-end="url(#pijl)"/><line x1="320" y1="362" x2="356" y2="362" stroke="#b7c2d2" stroke-width="1.5" marker-end="url(#pijl)"/><line x1="640" y1="362" x2="676" y2="362" stroke="#b7c2d2" stroke-width="1.5" marker-end="url(#pijl)"/><polyline points="820,228 820,254 180,254 180,282" fill="none" stroke="#b7c2d2" stroke-width="1.5" marker-end="url(#pijl)"/><text x="24" y="454" font-family="'DejaVu Sans Mono',Consolas,monospace" font-size="10" font-weight="400" fill="#68778c" text-anchor="start">Normen: IM en VM 99%, RRI en WIU 98% — alle vier worden in dit voorbeeld al in 2028 doorbroken.</text></svg>
