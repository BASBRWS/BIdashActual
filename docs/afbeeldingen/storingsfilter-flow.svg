<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-label="Procesflow van de actuele storingslijst: de volledige nieuwe momentopname wordt eerst gebruikt voor vergelijking met de vorige lijst en zichtbaar behouden van verdwenen meldingen als onbekend; daarnaast gaat dezelfde volledige bron naar een door de gebruiker instelbaar overzichtsfilter, waarna alleen de geselecteerde meldingen de actuele dienstimpact, verkeerskosten en het overzicht voeden.">
  <rect width="1040" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#93a4bc"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#003082"/></marker>
  </defs>
  <text x="40" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#0f1724">Actuele storingen: bron bewaren, overzicht gericht filteren</text>
  <text x="40" y="55" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">Het filter verandert nooit de bronmomentopname of de A↔B-historielogica.</text>

  <rect x="40" y="90" width="210" height="80" rx="6" fill="#f5f7fb" stroke="#93a4bc"/>
  <text x="56" y="116" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#003082">Nieuwe open lijst B</text>
  <text x="56" y="137" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">volledige XLSX / XLS / CSV</text>
  <text x="56" y="154" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">alle bronregels blijven bewaard</text>

  <line x1="250" y1="130" x2="326" y2="130" stroke="#93a4bc" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="288" y1="130" x2="288" y2="330" stroke="#93a4bc" stroke-width="1.6"/>
  <line x1="288" y1="330" x2="326" y2="330" stroke="#93a4bc" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="326" y="82" width="255" height="98" rx="6" fill="#ffffff" stroke="#93a4bc"/>
  <text x="342" y="108" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f1724">1 · Snapshot- en historielogica</text>
  <text x="342" y="130" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">vergelijk volledige lijst A ↔ B</text>
  <text x="342" y="148" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">verdwenen melding → onbekend behouden</text>
  <text x="342" y="166" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">→ historie, geen bewezen hersteltijd</text>

  <line x1="581" y1="130" x2="658" y2="130" stroke="#93a4bc" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="658" y="92" width="330" height="76" rx="6" fill="#f5f7fb" stroke="#93a4bc"/>
  <text x="674" y="117" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0f1724">Historische stroom</text>
  <text x="674" y="139" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">historie, prognose en kalibratie</text>
  <text x="674" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" fill="#b8530b">niet beïnvloed door het overzichtsfilter</text>

  <rect x="326" y="270" width="255" height="120" rx="6" fill="#eef5fb" stroke="#003082" stroke-width="1.5"/>
  <text x="342" y="296" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#003082">2 · Jouw overzichtsfilter</text>
  <text x="342" y="318" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">storingstype · gevolg · noodmaatregel</text>
  <text x="342" y="336" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">assettype · oorzaak · prioriteit / ernst</text>
  <text x="342" y="354" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">VC · RD · district · weg</text>
  <text x="342" y="376" font-family="'Segoe UI',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#003082">standaard telt alles mee</text>

  <line x1="581" y1="330" x2="658" y2="330" stroke="#003082" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <rect x="658" y="270" width="330" height="120" rx="6" fill="#ffffff" stroke="#003082" stroke-width="1.5"/>
  <text x="674" y="296" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#003082">Actuele doorrekening</text>
  <text x="674" y="319" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">alleen meldingen die door het filter komen</text>
  <text x="674" y="341" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">→ assetimpact en wegdelen</text>
  <text x="674" y="359" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">→ subprocessen en dienstverlening</text>
  <text x="674" y="377" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#4d5a6e">→ verkeerskosten en integraal overzicht</text>

  <rect x="40" y="421" width="948" height="30" rx="5" fill="#fff7e6" stroke="#e1bd68"/>
  <text x="54" y="441" font-family="'Segoe UI',Arial,sans-serif" font-size="10.8" fill="#6b531b">Controleer altijd de melding “X van Y open meldingen tellen mee”. Een actief filter is een analysekeuze, geen wijziging van de brondata.</text>
</svg>
