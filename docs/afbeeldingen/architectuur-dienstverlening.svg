<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="Logische architectuur van BiDash: dienstverlening bovenaan, rule engine en trigger engine in het midden, en bedrijfsvoering, technische assets en planning als drie informatiedomeinen daaronder.">
<rect width="1200" height="780" fill="#fff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="60" y="44" font-size="24" font-weight="700" fill="#0f172a">Logische architectuur BiDash</text>
<text x="60" y="70" font-size="13" fill="#475569">Dienstverlening is het doel. Drie informatiedomeinen voeden één vertaling via regels en triggers.</text>
<rect x="250" y="105" width="700" height="140" rx="14" fill="#eef5ff" stroke="#003082" stroke-width="2"/>
<text x="600" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#0050a0">DOELLAAG</text>
<text x="600" y="170" text-anchor="middle" font-size="25" font-weight="700" fill="#003082">VWM-dienstverlening</text>
<text x="600" y="196" text-anchor="middle" font-size="13" fill="#334155">Kunnen we de dienstverlening leveren, met welke prestatie, capaciteit, risico en kosten?</text>
<text x="600" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Incidentmanagement · Verkeersmanagement · Reis &amp; route-informatie · Werk in Uitvoering</text>
<line x1="600" y1="300" x2="600" y2="252" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="250" y="300" width="330" height="125" rx="12" fill="#fff8e5" stroke="#e5ad28" stroke-width="1.7"/>
<text x="275" y="332" font-size="19" font-weight="700" fill="#7a5b00">Rule engine</text>
<text x="275" y="357" font-size="12" fill="#475569">Bepaalt wat meetelt en hoe bronnen doorwerken.</text>
<text x="275" y="382" font-size="11.5" fill="#475569">• filters, afhankelijkheden, gewichten en koppelingen</text>
<text x="275" y="404" font-size="11.5" fill="#475569">• bronfeit → functie/proces → invloed op dienstverlening</text>
<rect x="620" y="300" width="330" height="125" rx="12" fill="#fff1ea" stroke="#e17000" stroke-width="1.7"/>
<text x="645" y="332" font-size="19" font-weight="700" fill="#9a4100">Trigger engine</text>
<text x="645" y="357" font-size="12" fill="#475569">Bepaalt wanneer een uitkomst aandacht of actie vraagt.</text>
<text x="645" y="382" font-size="11.5" fill="#475569">• normoverschrijding, capaciteitstekort, combinatie</text>
<text x="645" y="404" font-size="11.5" fill="#475569">• trend, prognose, deadline en risicodrempels</text>
<line x1="580" y1="362" x2="620" y2="362" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="55" y="505" width="335" height="190" rx="14" fill="#f4f8fc" stroke="#4f789b" stroke-width="1.7"/>
<text x="80" y="538" font-size="12" font-weight="700" fill="#4f789b">1 · BEDRIJFSVOERING</text>
<text x="80" y="570" font-size="21" font-weight="700" fill="#173b57">BI</text>
<text x="80" y="595" font-size="12" font-weight="600" fill="#334155">Hoe kunnen we de dienstverlening uitvoeren?</text>
<text x="80" y="624" font-size="11.5" fill="#475569">• formatie en capaciteit</text><text x="80" y="646" font-size="11.5" fill="#475569">• contracten, budget, leveranciers</text><text x="80" y="668" font-size="11.5" fill="#475569">• interne bedienketens en functies</text>
<rect x="432" y="505" width="335" height="190" rx="14" fill="#f3f8f4" stroke="#47835d" stroke-width="1.7"/>
<text x="457" y="538" font-size="12" font-weight="700" fill="#47835d">2 · TECHNISCHE MIDDELEN</text>
<text x="457" y="570" font-size="21" font-weight="700" fill="#245338">DVM-assets</text>
<text x="457" y="595" font-size="12" font-weight="600" fill="#334155">Welke middelen hebben we nodig en werken ze?</text>
<text x="457" y="624" font-size="11.5" fill="#475569">• assetregister en EOL</text><text x="457" y="646" font-size="11.5" fill="#475569">• actuele en historische storingen</text><text x="457" y="668" font-size="11.5" fill="#475569">• beschikbaarheid, prestatie, verkeerskosten</text>
<rect x="809" y="505" width="335" height="190" rx="14" fill="#faf5ff" stroke="#8b65a8" stroke-width="1.7"/>
<text x="834" y="538" font-size="12" font-weight="700" fill="#8b65a8">3 · EXTERNE INVLOEDEN</text>
<text x="834" y="570" font-size="21" font-weight="700" fill="#5d3d78">Planning &amp; context</text>
<text x="834" y="595" font-size="12" font-weight="600" fill="#334155">Wat verandert rondom de dienstverlening en wanneer?</text>
<text x="834" y="624" font-size="11.5" fill="#475569">• P6 / MS Project en afhankelijkheden</text><text x="834" y="646" font-size="11.5" fill="#475569">• geplande werkzaamheden en tijdvensters</text><text x="834" y="668" font-size="11.5" fill="#475569">• U-routes, afsluitingen en context</text>
<path d="M222 505C222 465 330 455 385 425" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M600 505L520 425" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M976 505C976 465 875 455 815 425" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M600 505L785 425" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="600" y="744" text-anchor="middle" font-size="11" fill="#64748b">Eén eigenaar per bronregel · één centrale vertaling naar dienstverlening · brondata blijven herleidbaar</text>
</g></svg>
