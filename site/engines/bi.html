<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; frame-src 'self' blob: about:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"><script src="../core/actual-profile.js?v=20261016-0834"></script><script src="../core/storingslog.js?v=20261016-0834"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BI Dash — Rule · Trigger · Dashboard | RWS WVM</title>
<style>
/* ═══════════════ TOKENS (RWS huisstijl) ═══════════════ */
:root{
  --rws-blauw:#003082; --rws-blauw-dark:#001f57; --rws-blauw-mid:#0050a0;
  --rws-geel:#F9B000; --rws-geel-l:#fff4d6;
  --wit:#fff; --bg:#f0f2f5; --panel:#f8f9fb;
  --grijs-mid:#d0d6de; --grijs-donker:#5a6478;
  --groen:#1a8a4a; --groen-l:#e6f5ed;
  --oranje:#e06b00; --oranje-l:#fff0e0;
  --rood:#c0121f; --rood-l:#fde8ea;
  --text:#1a2236; --sub:#4a5568; --border:#d0d6de;
  --shadow:0 2px 8px rgba(0,48,130,.10);
  --radius:4px; --radius-lg:8px;
  --mono:'Consolas','Cascadia Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--grijs-mid);border-radius:3px}

/* ═══════════════ RIJKSLINT + TOPBAR ═══════════════ */
.lint{height:4px;background:linear-gradient(to right,var(--rws-geel) 0 25%,var(--rws-blauw) 25% 75%,var(--rws-geel) 75% 100%);flex-shrink:0}
.topbar{background:var(--rws-blauw);color:#fff;display:flex;align-items:center;padding:0 18px;height:54px;gap:14px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:30px;height:30px}
.logo h1{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.logo .sub{font-size:10.5px;color:#9db4dd;display:block;margin-top:-2px;font-weight:400}
.nav{display:flex;gap:3px;margin-left:18px}
.nav button{background:transparent;border:none;color:#c2d1ea;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:var(--radius);font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .15s}
.nav button:hover{background:rgba(255,255,255,.1);color:#fff}
.nav button.active{background:var(--rws-geel);color:var(--rws-blauw-dark)}
.nav button .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.topbar .spacer{flex:1}
.topbar .tb-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:5px 12px;border-radius:var(--radius);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit}
.topbar .tb-btn:hover{background:rgba(255,255,255,.22)}
.simbadge{background:var(--rws-geel);color:var(--rws-blauw-dark);padding:4px 12px;border-radius:12px;font-size:11px;font-weight:700;display:none;align-items:center;gap:6px}
.simbadge.on{display:flex}

/* ═══════════════ MAIN LAYOUT ═══════════════ */
main{flex:1;overflow-y:auto;padding:18px 22px}
.page{display:none;max-width:1500px;margin:0 auto}
.page.active{display:block}
.pagehead{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h2{font-size:19px;color:var(--rws-blauw);font-weight:700}
.pagehead .desc{color:var(--sub);font-size:12.5px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px}

/* ═══════════════ GENERIEKE COMPONENTEN ═══════════════ */
.card{background:var(--wit);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card h3{font-size:13px;color:var(--rws-blauw);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .hint{font-weight:400;text-transform:none;letter-spacing:0;color:var(--sub);font-size:11.5px;margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{padding:6px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--wit);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text);transition:all .15s}
.btn:hover{border-color:var(--rws-blauw-mid);color:var(--rws-blauw)}
.btn.primary{background:var(--rws-blauw);border-color:var(--rws-blauw);color:#fff}
.btn.primary:hover{background:var(--rws-blauw-mid)}
.btn.warn{background:var(--rws-geel);border-color:var(--rws-geel);color:var(--rws-blauw-dark)}
.btn.danger{background:var(--wit);border-color:var(--rood);color:var(--rood)}
.btn.danger:hover{background:var(--rood-l)}
.btn.sm{padding:3px 9px;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:7px 10px;background:var(--panel);color:var(--sub);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #e8ecf2;vertical-align:middle}
tr:hover td{background:#f7f9fd}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:12px}
input[type=text],input[type=number],select{padding:5px 8px;border:1px solid var(--border);border-radius:var(--radius);font-size:12.5px;font-family:inherit;background:var(--wit);color:var(--text);width:100%}
input:focus,select:focus{outline:2px solid var(--rws-blauw-mid);outline-offset:-1px}
input[type=number]{font-family:var(--mono);text-align:right}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.tag.g{background:var(--groen-l);color:var(--groen)}
.tag.o{background:var(--oranje-l);color:var(--oranje)}
.tag.r{background:var(--rood-l);color:var(--rood)}
.tag.b{background:#e3ebf7;color:var(--rws-blauw)}
.tag.gy{background:#eef0f3;color:var(--grijs-donker)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .val{font-size:26px;font-weight:700;font-family:var(--mono);letter-spacing:-.5px}
.kpi .lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.kpi .delta{font-size:11px;font-weight:600}
.empty{padding:24px;text-align:center;color:var(--sub);font-size:12.5px}

/* ═══════════════ DASHBOARD: DE DRIEHOEK ═══════════════ */
.tri-wrap{display:grid;grid-template-columns:420px 1fr;gap:16px;align-items:stretch}
@media(max-width:1100px){.tri-wrap{grid-template-columns:1fr}}
.tri-card{background:linear-gradient(160deg,var(--rws-blauw-dark),var(--rws-blauw) 70%);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:14px;position:relative;overflow:hidden}
.tri-card svg{width:100%;display:block}
.tri-card .tri-title{color:#9db4dd;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:2px}
.tri-node{cursor:pointer}
.tri-node:hover .tri-box{filter:brightness(1.18)}
.tri-node text{pointer-events:none}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.6}}

/* ═══ Trigger lijst ═══ */
.trig{display:flex;gap:12px;padding:10px 12px;border:1px solid var(--border);border-left-width:4px;border-radius:var(--radius);margin-bottom:8px;background:var(--wit);align-items:flex-start}
.trig.r{border-left-color:var(--rood)} .trig.o{border-left-color:var(--oranje)} .trig.g{border-left-color:var(--groen)}
.trig .t-icon{font-size:16px;line-height:1.3}
.trig .t-body{flex:1;min-width:0}
.trig .t-title{font-weight:700;font-size:12.5px}
.trig .t-msg{color:var(--sub);font-size:12px}
.trig .t-meta{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;align-items:center}
.trig .t-val{font-family:var(--mono);font-size:11.5px;color:var(--text);background:var(--panel);padding:1px 7px;border-radius:3px;border:1px solid var(--border)}
.resp-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--rws-blauw);background:#e3ebf7;padding:2px 9px;border-radius:10px}
.resp-chip::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--rws-blauw)}

/* domein tegels */
.domtiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
@media(max-width:1100px){.domtiles{grid-template-columns:repeat(2,1fr)}}
.domtile{background:var(--wit);border:1px solid var(--border);border-top:4px solid var(--rws-blauw);border-radius:var(--radius-lg);padding:12px 14px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.domtile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,48,130,.16)}
.domtile.rag-g{border-top-color:var(--groen)} .domtile.rag-o{border-top-color:var(--oranje)} .domtile.rag-r{border-top-color:var(--rood)}
.domtile .d-name{font-weight:700;font-size:12.5px;color:var(--rws-blauw);margin-bottom:4px}
.domtile .d-stat{font-family:var(--mono);font-size:18px;font-weight:700}
.domtile .d-sub{font-size:11px;color:var(--sub)}
.domtile .d-src{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.domtile .d-src span{font-size:9.5px;background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:1px 6px;color:var(--grijs-donker);font-family:var(--mono)}

/* ═══════════════ RULE ENGINE ═══════════════ */
.rule-pxq{font-family:var(--mono);font-size:11.5px;color:var(--rws-blauw-mid);background:#eef3fb;padding:2px 8px;border-radius:3px;white-space:nowrap}
details.rulecat{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;background:var(--wit)}
details.rulecat summary{padding:10px 14px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--rws-blauw);list-style:none;display:flex;align-items:center;gap:10px}
details.rulecat summary::before{content:'▸';transition:transform .15s;font-size:11px}
details.rulecat[open] summary::before{transform:rotate(90deg)}
details.rulecat .rc-body{padding:0 14px 14px}

/* ═══════════════ SIMULATIE ═══════════════ */
.slider-row{display:grid;grid-template-columns:230px 1fr 90px;gap:14px;align-items:center;padding:9px 0;border-bottom:1px solid #eef1f5}
.slider-row:last-child{border-bottom:none}
.slider-row label{font-size:12.5px;font-weight:600}
.slider-row label small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.slider-row .sval{font-family:var(--mono);font-weight:700;font-size:13px;text-align:right;color:var(--rws-blauw)}
input[type=range]{width:100%;accent-color:var(--rws-blauw);height:22px}
.mc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.mc-stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.mc-stat .v{font-family:var(--mono);font-size:19px;font-weight:700}
.mc-stat .l{font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
canvas.chart{width:100%;background:var(--wit)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,50,.45);display:none;align-items:center;justify-content:center;z-index:500}
.modal-bg.open{display:flex}
.modal{background:var(--wit);border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,92vw);max-height:88vh;overflow-y:auto;padding:20px}
.modal h3{color:var(--rws-blauw);font-size:15px;margin-bottom:14px}
.frm{display:grid;grid-template-columns:150px 1fr;gap:10px 12px;align-items:center;font-size:12.5px}
.frm .full{grid-column:1/-1}
.modal .m-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.footnote{font-size:11px;color:var(--sub);margin-top:8px}
/* ═══════════════ P6 GANTT (zoals integrale-planning) ═══════════════ */
.gantt-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:auto;background:var(--wit);max-height:520px}
.gantt-wrap svg{display:block}
.g-blokrij{cursor:pointer}
.g-blokrij:hover rect.g-blokbg{filter:brightness(.96)}
.g-bar{rx:2}
.dropzone{border:2px dashed var(--grijs-mid);border-radius:var(--radius-lg);padding:28px;text-align:center;color:var(--sub);background:var(--panel);transition:all .15s}
.dropzone.over{border-color:var(--rws-blauw);background:#eef3fb}
.dropzone b{color:var(--rws-blauw)}
.p6-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:10px 0}
.p6-stats b{font-family:var(--mono);color:var(--text)}
.dienst-chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:3px;color:#fff}
.cfg-src{font-size:10px;color:var(--rws-blauw-mid);background:#eef3fb;border:1px solid #d6e2f5;border-radius:3px;padding:1px 6px;font-family:var(--mono);white-space:nowrap}
.cfg-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:12px}
.cfg-grid .cfg-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #eef1f5}
.cfg-grid .cfg-row .k{color:var(--sub)}
.cfg-grid .cfg-row .v{font-family:var(--mono);font-weight:600}
.cfg-link{font-size:10.5px;color:var(--groen);display:block}
.imp-chip{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;border:1px solid;white-space:nowrap}
.imp-formatie{background:#e3ebf7;color:var(--rws-blauw);border-color:#c3d5ef}
.imp-financien{background:var(--rws-geel-l);color:#8a6d00;border-color:#eedb9a}
.imp-asset{background:var(--oranje-l);color:var(--oranje);border-color:#f5cfa8}
.imp-richtlijn{background:var(--rood-l);color:var(--rood);border-color:#f0b8bd}
.imp-planning{background:#eef0f3;color:var(--grijs-donker);border-color:var(--grijs-mid)}

/* ═══════════════ ASSETMANAGEMENT (ISO 55001) ═══════════════ */
.keten-schema{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:8px 0}
.schakel{border:1px solid var(--border);border-top:3px solid var(--rws-blauw-mid);border-radius:var(--radius);background:var(--panel);padding:6px 10px;min-width:132px}
.schakel.zwak{border-top-color:var(--rood);background:var(--rood-l)}
.schakel .s-naam{font-weight:700;font-size:11.5px}
.schakel .s-meta{font-size:10px;color:var(--sub);font-family:var(--mono)}
.keten-pijl{align-self:center;color:var(--grijs-donker);font-weight:700;font-size:14px}
.los-lijn{font-size:11.5px;color:var(--sub);margin-top:6px}
.los-lijn b{color:var(--rws-blauw)}
.fw-chip{display:inline-block;font-size:10px;font-weight:700;font-family:var(--mono);padding:1px 6px;border-radius:3px;background:#e3ebf7;color:var(--rws-blauw)}
.fw-chip.hoog{background:var(--rood-l);color:var(--rood)}
</style>

</div>
